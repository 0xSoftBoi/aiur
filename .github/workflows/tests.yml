name: engineering-tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  p0-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run engineering tests
        run: python -m unittest discover -s tests -v
      - name: Print P0 budget
        run: python -m aiur.p0
      - name: SIL-B gate (digital twin)
        run: python -m aiur.sim.campaign --scenario sil-p0b --episodes 200 --seed 1
      - name: SIL-C gate (digital twin)
        run: python -m aiur.sim.campaign --scenario sil-p0c --episodes 200 --seed 1
      - name: SIL-D gate (digital twin)
        run: python -m aiur.sim.campaign --scenario sil-p0d --episodes 80 --seed 1
