<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#263238"/>
    </marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#111827}
      .sub{font:500 14px system-ui,sans-serif;fill:#4b5563}
      .label{font:600 14px system-ui,sans-serif;fill:#111827}
      .note{font:500 13px system-ui,sans-serif;fill:#374151}
      .part{stroke:#111827;stroke-width:3;fill:none;stroke-linejoin:round}
      .dim{stroke:#263238;stroke-width:1.5;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
      .ext{stroke:#9ca3af;stroke-width:1;stroke-dasharray:5 4}
      .sense{stroke:#047857;stroke-width:3;fill:#d1fae5}
      .keeper{stroke:#1d4ed8;stroke-width:4;fill:#dbeafe}
      .probe{stroke:#b45309;stroke-width:4;fill:#fef3c7}
      .rotor{stroke:#dc2626;stroke-width:2;stroke-dasharray:8 6}
    </style>
  </defs>

  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="48" y="45" class="title">CARRIER-P0 — P0-A REV A DOCK CROSS-SECTION</text>
  <text x="48" y="70" class="sub">SCREENING ARTICLE • DIMENSIONS IN mm • PHYSICAL FIT TEST OWNS FINAL GEOMETRY</text>

  <line x1="340" y1="105" x2="660" y2="105" class="part"/>
  <rect x="450" y="105" width="100" height="68" rx="5" fill="#f3f4f6" stroke="#111827" stroke-width="3"/>
  <text x="675" y="112" class="label">bench / structural rail adapter</text>

  <path d="M484 220 L320 350 L320 365 M516 220 L680 350 L680 365" class="part"/>
  <line x1="320" y1="350" x2="680" y2="350" class="ext"/>
  <text x="350" y="300" class="label">1.2 wall</text>
  <text x="350" y="319" class="note">funnel section</text>

  <rect x="474" y="198" width="52" height="24" rx="5" class="sense"/>
  <text x="535" y="204" class="label">S1 probe-seat switch</text>
  <rect x="456" y="176" width="88" height="15" rx="4" class="keeper"/>
  <text x="555" y="184" class="label">positive keeper + S2</text>

  <line x1="500" y1="217" x2="500" y2="440" class="probe"/>
  <circle cx="500" cy="220" r="12" class="probe"/>
  <text x="200" y="206" class="label">Ø12 rounded probe head</text>
  <line x1="330" y1="202" x2="482" y2="217" class="ext"/>
  <text x="525" y="410" class="label">Ø3 neck / mast</text>

  <line x1="345" y1="440" x2="655" y2="440" class="rotor"/>
  <circle cx="400" cy="440" r="28" fill="none" stroke="#dc2626" stroke-width="2"/>
  <circle cx="600" cy="440" r="28" fill="none" stroke="#dc2626" stroke-width="2"/>
  <rect x="465" y="428" width="70" height="25" rx="6" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="675" y="444" class="label">propeller plane / aircraft</text>
  <text x="675" y="463" class="note">props removed for P0-A</text>

  <line x1="320" y1="385" x2="680" y2="385" class="dim"/>
  <line x1="320" y1="350" x2="320" y2="397" class="ext"/>
  <line x1="680" y1="350" x2="680" y2="397" class="ext"/>
  <text x="465" y="380" class="label">Ø180</text>

  <line x1="484" y1="245" x2="516" y2="245" class="dim"/>
  <text x="525" y="250" class="label">Ø16 throat</text>

  <line x1="725" y1="220" x2="725" y2="350" class="dim"/>
  <line x1="680" y1="220" x2="740" y2="220" class="ext"/>
  <line x1="680" y1="350" x2="740" y2="350" class="ext"/>
  <text x="738" y="290" class="label">65 depth</text>

  <line x1="825" y1="220" x2="825" y2="440" class="dim"/>
  <line x1="515" y1="220" x2="840" y2="220" class="ext"/>
  <line x1="655" y1="440" x2="840" y2="440" class="ext"/>
  <text x="838" y="330" class="label">110 tip → prop plane</text>

  <line x1="765" y1="350" x2="765" y2="440" class="dim"/>
  <text x="778" y="400" class="label">~45 nominal lip clearance</text>

  <rect x="50" y="520" width="900" height="150" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="75" y="550" class="label">REV-A SCREENING TARGETS</text>
  <text x="75" y="580" class="note">Dock ≤180 g • probe ≤8 g • axial hold ≥5 N / 10 s • lateral hold ≥1 N / 10 s in ±X, ±Y</text>
  <text x="75" y="608" class="note">Capture truth = S1 seated AND S2 keeper physically closed. Servo command alone never confirms capture.</text>
  <text x="75" y="636" class="note">Current Crazyflie swept radial estimate ≈77.5 mm vs 90 mm funnel radius → do not rely on coplanar aperture clearance.</text>
  <text x="75" y="656" class="note">Measure the actual guard envelope and probe flex before P0-B live approach.</text>
</svg>

