<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="70mm" viewBox="0 0 100 70">
  <style>
    .drill{fill:none;stroke:#d00;stroke-width:.3}
    .axis{stroke:#777;stroke-width:.15;stroke-dasharray:2 1}
    .cut{fill:none;stroke:#000;stroke-width:.25}
    .text{font:3px sans-serif;fill:#000}
  </style>
  <text x="4" y="7" class="text">P0-A REV-B - KEEPER DRIVE PIN TEMPLATE - PRINT 100%</text>
  <text x="4" y="12" class="text">Pins &#216;3; crank 6.5 mm centres; link 19.5 mm centres</text>
  <line x1="14" y1="24" x2="32.5" y2="24" class="axis"/>
  <text x="4" y="25" class="text">CRANK</text>
  <circle cx="20" cy="24" r="1.5" class="drill"/>
  <circle cx="26.5" cy="24" r="1.5" class="drill"/>
  <line x1="14" y1="40" x2="45.5" y2="40" class="axis"/>
  <text x="4" y="41" class="text">LINK</text>
  <circle cx="20" cy="40" r="1.5" class="drill"/>
  <circle cx="39.5" cy="40" r="1.5" class="drill"/>
  <line x1="20" y1="60" x2="70" y2="60" class="cut"/>
  <line x1="20" y1="58.5" x2="20" y2="61.5" class="cut"/>
  <line x1="70" y1="58.5" x2="70" y2="61.5" class="cut"/>
  <text x="38" y="57" class="text">50 mm CHECK</text>
  <text x="4" y="67" class="text">Stroke = 2 x crank centres = 13 mm; verify at the keeper with a dial indicator.</text>
</svg>
