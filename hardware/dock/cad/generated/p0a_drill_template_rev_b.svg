<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="100mm" viewBox="0 0 100 100">
  <style>
    .cut{fill:none;stroke:#000;stroke-width:.25}
    .drill{fill:none;stroke:#d00;stroke-width:.3}
