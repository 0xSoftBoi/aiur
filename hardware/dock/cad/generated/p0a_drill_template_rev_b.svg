  <line x1="25" y1="92" x2="75" y2="92" class="cut"/>
  <line x1="25" y1="90.5" x2="25" y2="93.5" class="cut"/>
  <line x1="75" y1="90.5" x2="75" y2="93.5" class="cut"/>
