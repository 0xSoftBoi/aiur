<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#263238"/>
    </marker>
    <style>
  .t{font:700 26px system-ui,sans-serif;fill:#111827}
  .h{font:700 13px system-ui,sans-serif;fill:#111827;letter-spacing:0.04em}
  .s{font:500 12.5px system-ui,sans-serif;fill:#4b5563}
  .l{font:600 12.5px system-ui,sans-serif;fill:#111827}
  .m{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#111827}
  .w{font:700 14px system-ui,sans-serif;fill:#b91c1c}
  .body{stroke:#111827;stroke-width:2;fill:#eef2f7;stroke-linejoin:round}
  .mould{stroke:#b91c1c;stroke-width:3.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .dim{stroke:#263238;stroke-width:1.2;fill:none;marker-start:url(#a);marker-end:url(#a)}
  .ext{stroke:#9ca3af;stroke-width:1}
  .ax{stroke:#9ca3af;stroke-width:1.2;stroke-dasharray:12 4 3 4}
  .rule{stroke:#d1d5db;stroke-width:1}
  .frame{stroke:#111827;stroke-width:1.6;fill:none}
</style>
  </defs>
  <rect width="1680" height="1188" fill="#fff"/>
  <rect x="40" y="40" width="1600" height="1108" class="frame"/>
  <text x="64" y="100" class="t">CARRIER-P0 TOOLING &#8212; T-100 THROAT CUP MOULD</text>
  <text x="64" y="128" class="s">MOULDS CS-100 &#8212; FEMALE MOULD &#8212; A3 SHEET, DIMENSIONS IN mm &#8212; GENERATED FROM generate_tools.py</text>
  <text x="64" y="164" class="w">MOULDING DIMENSIONS ARE COMPENSATED. SCALE FACTOR 0.996636 APPLIED. DO NOT WORK TO THE PART DRAWING.</text>
  <text x="64" y="198" class="h">SECTION &#8212; MOULDING SURFACE IN RED &#8212; DRAWN AT 0.5:1</text>
  <line x1="362.0" y1="198" x2="362.0" y2="562" class="ax"/>
  <polygon points="350.00,399.88 322.13,399.88 251.44,330.12 181.44,330.12 181.44,429.88 350.00,429.88" class="body"/><polyline points="322.13,399.88 251.44,330.12" class="mould"/><polygon points="374.00,429.88 542.56,429.88 542.56,330.12 472.56,330.12 401.87,399.88 374.00,399.88" class="body"/><polyline points="472.56,330.12 401.87,399.88" class="mould"/>
  <line x1="181.4" y1="574.0" x2="542.6" y2="574.0" class="dim"/><text x="362.0" y="594.0" class="m" text-anchor="middle">&#216;180.56</text><line x1="686.0" y1="330.1" x2="686.0" y2="429.9" class="dim"/><text x="696.0" y="380.0" class="m" text-anchor="start">49.88</text>
  <text x="64" y="624" class="s">Female mould forming the outer surface of the capture throat cup. The cavity</text><text x="64" y="642" class="s">is the part's aircraft-contact face, so the cavity's finish is the part's</text><text x="64" y="660" class="s">finish.</text>
  <text x="64" y="686" class="l">Finished envelope 180.6 x 180.6 x 49.9 mm &#8212; stock 187 x 187 x 56 mm &#8212; 1109 cm&#179; finished.</text>
  <text x="744" y="216" class="h">DIMENSION</text><text x="1244" y="216" class="h">VALUE</text><text x="1364" y="216" class="h">TOL</text><text x="1444" y="216" class="h">CLASS</text><line x1="744" y1="226" x2="1564" y2="226" class="rule"/><text x="744" y="250" class="l">cavity throat radius</text><text x="1244" y="250" class="m">19.933 mm</text><text x="1364" y="250" class="m">&#177;0.05</text><text x="1444" y="250" class="s">moulding surface</text><text x="744" y="266" class="s">part throat R20 x 0.996636 thermal scale</text><text x="744" y="290" class="l">cavity rim radius</text><text x="1244" y="290" class="m">55.279 mm</text><text x="1364" y="290" class="m">&#177;0.05</text><text x="1444" y="290" class="s">moulding surface</text><text x="744" y="306" class="s">derived from the held throat and the compensated cone angle</text><text x="744" y="330" class="l">cavity depth</text><text x="1244" y="330" class="m">34.882 mm</text><text x="1364" y="330" class="m">&#177;0.05</text><text x="1444" y="330" class="s">moulding surface</text><text x="744" y="346" class="s">part depth 35 x 0.996636 thermal scale</text><text x="744" y="370" class="l">cone half-angle</text><text x="1244" y="370" class="m">45.379 deg</text><text x="1364" y="370" class="m">&#177;0.05</text><text x="1444" y="370" class="s">moulding surface</text><text x="744" y="386" class="s">part 45 deg opened by 0.379 deg of predicted spring-in</text><text x="744" y="410" class="l">seal land width</text><text x="1244" y="410" class="m">25.000 mm</text><text x="1364" y="410" class="m">&#177;0.25</text><text x="1444" y="410" class="s">sealing</text><text x="744" y="426" class="s">sealant-tape land outboard of the cavity rim; flat and continuous</text><text x="744" y="450" class="l">top face flatness</text><text x="1244" y="450" class="m">0.050 mm</text><text x="1364" y="450" class="m">&#177;0.05</text><text x="1444" y="450" class="s">sealing</text><text x="744" y="466" class="s">flatness of the whole top annulus, not a size</text><text x="744" y="490" class="l">central bore diameter</text><text x="1244" y="490" class="m">12.000 mm</text><text x="1364" y="490" class="m">&#177;0.05</text><text x="1444" y="490" class="s">datum</text><text x="744" y="506" class="s">H7; demould push-rod and centring pin, plugged during cure</text><text x="744" y="530" class="l">outside radius</text><text x="1244" y="530" class="m">90.279 mm</text><text x="1364" y="530" class="m">&#177;0.25</text><text x="1444" y="530" class="s">free</text><text x="744" y="546" class="s">stock envelope</text><text x="744" y="570" class="l">overall height</text><text x="1244" y="570" class="m">49.882 mm</text><text x="1364" y="570" class="m">&#177;0.25</text><text x="1444" y="570" class="s">free</text><text x="744" y="586" class="s">base thickness plus cavity depth</text>
  <text x="744" y="632" class="h">MATERIAL, FINISH AND SERVICE</text><text x="744" y="650" class="s">aluminium 6061 plate, T651 tooling plate. Rough, stress relieve, then finish &#8212; machining</text><text x="744" y="668" class="s">rolled plate releases residual stress, and a tool that moves after finishing has to be cut</text><text x="744" y="686" class="s">again.</text><text x="744" y="704" class="s">Moulding surface 0.4 Ra; all other machined faces 1.6 Ra.</text><text x="744" y="722" class="s">Service: 200 degC under 690 kPa, repeatedly.</text><text x="744" y="740" class="s">Model faceting lies inside the true surface by 8 micrometres. Where the model and this table</text><text x="744" y="758" class="s">disagree, the table governs.</text>
  <text x="64" y="806" class="h">SECONDARY OPERATIONS</text><text x="64" y="832" class="s">1. 2 x 6 H7 dowel holes on a 140 mm bolt circle, 180 deg apart, through</text><text x="64" y="850" class="s">the top annulus into the base &#8212; they locate the trim template</text><text x="64" y="874" class="s">2. 4 x M6 x 12 deep tapped in the back face on a 120 mm bolt circle &#8212;</text><text x="64" y="892" class="s">handling and fixturing only</text><text x="64" y="916" class="s">3. 1 x 3 wide x 2 deep radial groove across the seal land, outside</text><text x="64" y="934" class="s">diameter to cavity rim &#8212; thermocouple route out from under the bag</text><text x="64" y="958" class="s">4. plug the central bore flush during cure; the plug is shop-supplied</text><text x="64" y="982" class="s">5. break all edges 0.3 x 45 deg except inside the cavity</text>
  <text x="744" y="806" class="h">NOTES</text><text x="744" y="832" class="s">1. The cavity is a moulding surface. No stamping, scribing, engraving or</text><text x="744" y="850" class="s">witness marks anywhere inside it &#8212; the part copies them, and a copied tool</text><text x="744" y="868" class="s">mark on the aircraft-contact face is a reject.</text><text x="744" y="892" class="s">2. Identification is stamped on the outside diameter only.</text><text x="744" y="916" class="s">3. The seal land must be flat and continuous. A scratch across it is a</text><text x="744" y="934" class="s">vacuum leak, and a leak during cure makes a porous part that no inspection</text><text x="744" y="952" class="s">afterwards will separate from a good one cheaply.</text><text x="744" y="976" class="s">4. Machine the cavity with a radial or helical toolpath, not a raster: a</text><text x="744" y="994" class="s">raster leaves a cusp pattern that prints through into a 0.4 mm laminate.</text>
  <line x1="64" y1="1122" x2="1616" y2="1122" class="rule"/>
  <text x="64" y="1144" class="s">The solid model t100.stl is the master geometry. This sheet carries tolerances, feature classes, secondary operations and notes &#8212; it does not redefine the surface.</text>
</svg>
