  <rect width="1680" height="1188" fill="#fff"/>
  <rect x="40" y="40" width="1600" height="1108" class="frame"/>
  <text x="64" y="100" class="t">CARRIER-P0 TOOLING &#8212; T-301 KEEPER TINE DIE &#8212; PUNCH HALF</text>
  <text x="64" y="128" class="s">MOULDS CS-400 &#8212; MALE MOULD &#8212; A3 SHEET, DIMENSIONS IN mm &#8212; GENERATED FROM generate_tools.py</text>
  <text x="64" y="164" class="w">MOULDING DIMENSIONS ARE COMPENSATED. SCALE FACTOR 0.996573 APPLIED. DO NOT WORK TO THE PART DRAWING.</text>
  <text x="64" y="198" class="h">SECTION &#8212; MOULDING SURFACE IN RED &#8212; DRAWN AT 2:1</text>
  
  <polygon points="601.11,542.07 152.42,542.07 150.77,542.01 149.14,541.85 147.51,541.59 145.91,541.22 144.33,540.74 142.79,540.17 141.28,539.49 139.83,538.72 138.43,537.86 137.08,536.91 135.80,535.87 134.60,534.76 133.46,533.56 132.41,532.30 131.44,530.97 130.55,529.58 129.76,528.13 129.07,526.64 128.47,525.10 127.98,523.53 127.59,521.94 127.30,520.31 127.11,518.68 127.04,517.03 122.89,217.93 601.11,217.93" class="body"/><polyline points="601.11,542.07 152.42,542.07 150.77,542.01 149.14,541.85 147.51,541.59 145.91,541.22 144.33,540.74 142.79,540.17 141.28,539.49 139.83,538.72 138.43,537.86 137.08,536.91 135.80,535.87 134.60,534.76 133.46,533.56 132.41,532.30 131.44,530.97 130.55,529.58 129.76,528.13 129.07,526.64 128.47,525.10 127.98,523.53 127.59,521.94 127.30,520.31 127.11,518.68 127.04,517.03 122.89,217.93" class="mould"/>
  <line x1="122.9" y1="574.0" x2="601.1" y2="574.0" class="dim"/><text x="362.0" y="594.0" class="m" text-anchor="middle">59.78</text><line x1="686.0" y1="217.9" x2="686.0" y2="542.1" class="dim"/><text x="696.0" y="380.0" class="m" text-anchor="start">40.52</text>
  <text x="64" y="624" class="s">Punch half of the matched die set; forms the inner surface of the keeper tine</text><text x="64" y="642" class="s">and carries the closing load into the laminate.</text>
  <text x="64" y="668" class="l">Finished envelope 59.8 x 40.5 x 28.0 mm &#8212; stock 66 x 46 x 34 mm &#8212; 67 cm&#179; finished.</text>
  <text x="744" y="216" class="h">DIMENSION</text><text x="1244" y="216" class="h">VALUE</text><text x="1364" y="216" class="h">TOL</text><text x="1444" y="216" class="h">CLASS</text><line x1="744" y1="226" x2="1564" y2="226" class="rule"/><text x="744" y="250" class="l">enclosed corner angle</text><text x="1244" y="250" class="m">90.795 deg</text><text x="1364" y="250" class="m">&#177;0.05</text><text x="1444" y="250" class="s">moulding surface</text><text x="744" y="266" class="s">matches T-300; the pair is cut to one angle</text><text x="744" y="290" class="l">inner corner radius</text><text x="1244" y="290" class="m">3.173 mm</text><text x="1364" y="290" class="m">&#177;0.05</text><text x="1444" y="290" class="s">moulding surface</text><text x="744" y="306" class="s">max(2 x laminate thickness, 3.0) x 0.996573 thermal scale</text><text x="744" y="330" class="l">closed gap to T-300</text><text x="1244" y="330" class="m">1.592 mm</text><text x="1364" y="330" class="m">&#177;0.03</text><text x="1444" y="330" class="s">moulding surface</text><text x="744" y="346" class="s">the part thickness; verify by shim with the pair closed dry</text><text x="744" y="370" class="l">blade leg length</text><text x="1244" y="370" class="m">56.087 mm</text><text x="1364" y="370" class="m">&#177;0.25</text><text x="1444" y="370" class="s">moulding surface</text><text x="744" y="386" class="s">matches T-300</text><text x="744" y="410" class="l">root leg length</text><text x="1244" y="410" class="m">37.391 mm</text><text x="1364" y="410" class="m">&#177;0.25</text><text x="1444" y="410" class="s">moulding surface</text><text x="744" y="426" class="s">matches T-300</text><text x="744" y="450" class="l">die width</text><text x="1244" y="450" class="m">27.959 mm</text><text x="1364" y="450" class="m">&#177;0.25</text><text x="1444" y="450" class="s">free</text><text x="744" y="466" class="s">matches T-300</text>
  <text x="744" y="512" class="h">MATERIAL, FINISH AND SERVICE</text><text x="744" y="530" class="s">aluminium 6061 plate, T651 tooling plate. Rough, stress relieve, then finish &#8212; machining</text><text x="744" y="548" class="s">rolled plate releases residual stress, and a tool that moves after finishing has to be cut</text><text x="744" y="566" class="s">again.</text><text x="744" y="584" class="s">Moulding surface 0.4 Ra; all other machined faces 1.6 Ra.</text><text x="744" y="602" class="s">Service: 200 degC under 690 kPa, repeatedly.</text><text x="744" y="620" class="s">Model faceting lies inside the true surface by 2 micrometres. Where the model and this table</text><text x="744" y="638" class="s">disagree, the table governs.</text>
  <text x="64" y="716" class="h">SECONDARY OPERATIONS</text><text x="64" y="742" class="s">1. dowel and closing-bolt holes bored as a set with T-300</text><text x="64" y="766" class="s">2. break all edges 0.3 x 45 deg except on the moulding face</text>
  <text x="744" y="716" class="h">NOTES</text><text x="744" y="742" class="s">1. Matched pair. The gap between the two moulding faces IS the part</text><text x="744" y="760" class="s">thickness, 1.592 mm nominal, and it is the dimension that matters more</text><text x="744" y="778" class="s">than either half on its own: cut both, close them dry, and shim-check the</text><text x="744" y="796" class="s">gap before either half is accepted.</text><text x="744" y="820" class="s">2. The enclosed corner is cut open by the predicted spring-in. Do not</text><text x="744" y="838" class="s">correct it back to 90 degrees.</text><text x="744" y="862" class="s">3. Bore the dowels and the closing-bolt holes with the two halves clamped</text><text x="744" y="880" class="s">together as a set, so they close in register.</text><text x="744" y="904" class="s">4. The solid model carries the moulding geometry and the block envelope.</text><text x="744" y="922" class="s">Dowel, bolt and thermocouple features are listed as secondary operations</text><text x="744" y="940" class="s">and are not in the model.</text>
  <line x1="64" y1="1122" x2="1616" y2="1122" class="rule"/>
  <text x="64" y="1144" class="s">The solid model t301.stl is the master geometry. This sheet carries tolerances, feature classes, secondary operations and notes &#8212; it does not redefine the surface.</text>
</svg>
