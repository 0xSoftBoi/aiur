</style>
  </defs>
  <rect width="1680" height="1188" fill="#fff"/>
  <rect x="40" y="40" width="1600" height="1108" class="frame"/>
  <text x="64" y="100" class="t">CARRIER-P0 TOOLING &#8212; T-200 BOOM MANDREL</text>
  <text x="64" y="128" class="s">MOULDS CS-200 &#8212; MALE MOULD &#8212; A3 SHEET, DIMENSIONS IN mm &#8212; GENERATED FROM generate_tools.py</text>
  <text x="64" y="164" class="w">MOULDING DIMENSIONS ARE COMPENSATED. SCALE FACTOR 0.996557 APPLIED. DO NOT WORK TO THE PART DRAWING.</text>
  <text x="64" y="198" class="h">SECTION &#8212; MOULDING SURFACE IN RED &#8212; DRAWN AT 2:1</text>
  
  <polygon points="122.00,500.00 602.00,500.00 602.00,311.89 487.26,311.89 478.80,303.96 469.84,296.61 460.42,289.85 450.57,283.73 440.35,278.27 429.79,273.48 418.94,269.40 407.85,266.04 396.56,263.40 385.12,261.52 373.59,260.38 362.00,260.00 350.41,260.38 338.88,261.52 327.44,263.40 316.15,266.04 305.06,269.40 294.21,273.48 283.65,278.27 273.43,283.73 263.58,289.85 254.16,296.61 245.20,303.96 236.74,311.89 122.00,311.89" class="body"/><polyline points="487.26,311.89 478.80,303.96 469.84,296.61 460.42,289.85 450.57,283.73 440.35,278.27 429.79,273.48 418.94,269.40 407.85,266.04 396.56,263.40 385.12,261.52 373.59,260.38 362.00,260.00 350.41,260.38 338.88,261.52 327.44,263.40 316.15,266.04 305.06,269.40 294.21,273.48 283.65,278.27 273.43,283.73 263.58,289.85 254.16,296.61 245.20,303.96 236.74,311.89" class="mould"/>
  <line x1="122.0" y1="574.0" x2="602.0" y2="574.0" class="dim"/><text x="362.0" y="594.0" class="m" text-anchor="middle">60.00</text><line x1="686.0" y1="260.0" x2="686.0" y2="500.0" class="dim"/><text x="696.0" y="380.0" class="m" text-anchor="start">30.00</text>
  <text x="64" y="624" class="s">Male mandrel forming the inner surface of the deployable capture-ring boom.</text><text x="64" y="642" class="s">The laminate is laid over the crown and bagged down onto it.</text>
  <text x="64" y="668" class="l">Finished envelope 60.0 x 30.0 x 290.0 mm &#8212; stock 66 x 36 x 296 mm &#8212; 450 cm&#179; finished.</text>
  <text x="744" y="216" class="h">DIMENSION</text><text x="1244" y="216" class="h">VALUE</text><text x="1364" y="216" class="h">TOL</text><text x="1444" y="216" class="h">CLASS</text><line x1="744" y1="226" x2="1564" y2="226" class="rule"/><text x="744" y="250" class="l">crown radius</text><text x="1244" y="250" class="m">22.143 mm</text><text x="1364" y="250" class="m">&#177;0.05</text><text x="1444" y="250" class="s">moulding surface</text><text x="744" y="266" class="s">part mid-surface R22.3 less half the 0.160 mm laminate, x 0.996557 thermal</text><text x="744" y="282" class="s">scale</text><text x="744" y="306" class="l">subtended angle</text><text x="1244" y="306" class="m">90.000 deg</text><text x="1364" y="306" class="m">&#177;0.1</text><text x="1444" y="306" class="s">moulding surface</text><text x="744" y="322" class="s">part section angle; a cylindrical section has no enclosed corner, so no</text><text x="744" y="338" class="s">spring-in compensation applies</text><text x="744" y="362" class="l">crown radius form error</text><text x="1244" y="362" class="m">0.030 mm</text><text x="1364" y="362" class="m">&#177;0.05</text><text x="1444" y="362" class="s">moulding surface</text><text x="744" y="378" class="s">deviation from a true circular arc, checked along the length</text><text x="744" y="402" class="l">moulding length</text><text x="1244" y="402" class="m">250.000 mm</text><text x="1364" y="402" class="m">&#177;0.25</text><text x="1444" y="402" class="s">moulding surface</text><text x="744" y="418" class="s">part length; the mandrel is longer by the runout at each end</text><text x="744" y="442" class="l">overall length</text><text x="1244" y="442" class="m">290.000 mm</text><text x="1364" y="442" class="m">&#177;0.25</text><text x="1444" y="442" class="s">free</text><text x="744" y="458" class="s">part length plus 20 mm runout each end for bag tuck-off</text><text x="744" y="482" class="l">base width</text><text x="1244" y="482" class="m">60.000 mm</text><text x="1364" y="482" class="m">&#177;0.25</text><text x="1444" y="482" class="s">free</text><text x="744" y="498" class="s">stock envelope</text><text x="744" y="522" class="l">base depth</text><text x="1244" y="522" class="m">30.000 mm</text><text x="1364" y="522" class="m">&#177;0.25</text><text x="1444" y="522" class="s">free</text><text x="744" y="538" class="s">stock envelope</text><text x="744" y="562" class="l">base flatness</text><text x="1244" y="562" class="m">0.050 mm</text><text x="1364" y="562" class="m">&#177;0.05</text><text x="1444" y="562" class="s">datum</text><text x="744" y="578" class="s">the mandrel is located and clamped on its base</text>
  <text x="744" y="624" class="h">MATERIAL, FINISH AND SERVICE</text><text x="744" y="642" class="s">aluminium 6061 plate, T651 tooling plate. Rough, stress relieve, then finish &#8212; machining</text><text x="744" y="660" class="s">rolled plate releases residual stress, and a tool that moves after finishing has to be cut</text><text x="744" y="678" class="s">again.</text><text x="744" y="696" class="s">Moulding surface 0.4 Ra; all other machined faces 1.6 Ra.</text><text x="744" y="714" class="s">Service: 200 degC under 690 kPa, repeatedly.</text><text x="744" y="732" class="s">Model faceting lies inside the true surface by 12 micrometres. Where the model and this</text><text x="744" y="750" class="s">table disagree, the table governs.</text>
  <text x="64" y="798" class="h">SECONDARY OPERATIONS</text><text x="64" y="824" class="s">1. 2 x 6 H7 dowel holes in the base, 200 mm apart on the centreline &#8212; they</text><text x="64" y="842" class="s">locate the mandrel in the layup fixture</text><text x="64" y="866" class="s">2. 2 x M8 through the base for clamping to the bench</text><text x="64" y="890" class="s">3. blend the crown-to-shoulder transition smoothly; a step there prints</text><text x="64" y="908" class="s">through into a 0.16 mm laminate</text><text x="64" y="932" class="s">4. break all edges 0.3 x 45 deg except on the crown</text>
  <text x="744" y="798" class="h">NOTES</text><text x="744" y="824" class="s">1. The crown is a moulding surface. Machine it along the length, not</text><text x="744" y="842" class="s">across it: circumferential tool marks transfer into the part and sit</text><text x="744" y="860" class="s">transverse to the direction it is later rolled.</text><text x="744" y="884" class="s">2. This tool carries a thermal scale factor and no spring-in compensation,</text><text x="744" y="902" class="s">because a cylindrical section has no enclosed corner to spring in. That is</text><text x="744" y="920" class="s">a result, not an omission.</text><text x="744" y="944" class="s">3. The crown radius is the inner surface. The part's quoted radius is its</text><text x="744" y="962" class="s">mid-surface, and the difference is half a laminate thickness.</text>
  <line x1="64" y1="1122" x2="1616" y2="1122" class="rule"/>
  <text x="64" y="1144" class="s">The solid model t200.stl is the master geometry. This sheet carries tolerances, feature classes, secondary operations and notes &#8212; it does not redefine the surface.</text>
</svg>
