; Flight-termination unit, LilyGO T-Beam Supreme class board (ESP32-S3).
;
;   pio run -e ftu          flight build: no serial logging, needs src/ftu_secrets.h
;   pio run -e ftu_bench    bench build: USB serial logging, development key allowed
;
; The decision logic is NOT tested by this build.  It is tested on the host:
;   make -C host
;
; The generic ESP32-S3 DevKitC board definition is used because PlatformIO
; ships none for the T-Beam Supreme.  Flash size and USB mode below are for
; the Supreme as remembered (ESP32-S3FN8: 8 MB flash, native USB) - verify
; against the module marking before the first upload.

[platformio]
default_envs = ftu
src_dir = src

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib @ ^7.1.2
    sparkfun/SparkFun u-blox GNSS v3 @ ^3.1.8
    lewisxhe/XPowersLib @ ^0.2.7
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall -Wextra
    ; IEEE comparison semantics are part of the logic (NaN = unknown).
    -fno-fast-math
    -DFTU_HAS_AXP2101=1
    -DFTU_HAS_VBAT_SENSE=1
    -DFTU_FREQ_MHZ=869.525

[env:ftu]
build_flags =
    ${env.build_flags}
    -DFTU_DEBUG_SERIAL=0
    ; Refuse to build with the public development key.
    -DFTU_REQUIRE_KEY=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:ftu_bench]
build_flags =
    ${env.build_flags}
    -DFTU_DEBUG_SERIAL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
