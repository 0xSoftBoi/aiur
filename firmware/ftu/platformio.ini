; Flight-termination unit, LilyGO T-Beam S3 Supreme, SX1262 + u-blox variant.
;
;   pio run -e ftu          flight build: no serial logging, needs src/ftu_secrets.h
;   pio run -e ftu_bench    bench build: USB serial logging, development key allowed
;
; The decision logic is NOT tested by this build.  It is tested on the host:
;   make -C host
;
; PlatformIO ships no T-Beam S3 Supreme board, so boards/t-beams3-supreme.json
; is LilyGO's own definition (LilyGo-LoRa-Series @5f537f1,
; boards/t-beams3-supreme.json; used by their env T_BEAM_S3_SUPREME_SX1262,
; platformio.ini L335-341) with one change: ARDUINO_USB_CDC_ON_BOOT is left to
; the environments below.  Verified from that file and from LilyGO's
; docs/en/t_beam_supreme/t_beam_supreme_hw.md L18-21, L56-75: ESP32-S3FN8,
; 8 MB quad-SPI flash, QIO 80 MHz, native USB in CDC+JTAG mode
; (ARDUINO_USB_MODE=1).  Meshtastic's env tbeam-s3-core (meshtastic/firmware
; @fe89ac1, boards/tbeam-s3-core.json) agrees on 8 MB and default_8MB.csv; it
; uses DIO and TinyUSB (USB_MODE=0), which this firmware does not need.
; The board's 8 MB quad-SPI PSRAM is deliberately NOT enabled
; (no -DBOARD_HAS_PSRAM): nothing here uses it.
; Not verified on a board: read the flash size from the esptool banner at the
; first upload.

[platformio]
default_envs = ftu
src_dir = src

[env]
platform = espressif32
board = t-beams3-supreme
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib @ ^7.1.2
    sparkfun/SparkFun u-blox GNSS v3 @ ^3.1.8
    lewisxhe/XPowersLib @ ^0.2.7
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall -Wextra
    ; IEEE comparison semantics are part of the logic (NaN = unknown).
    -fno-fast-math
    -DFTU_HAS_AXP2101=1
    -DFTU_HAS_VBAT_SENSE=1
    -DFTU_FREQ_MHZ=869.525

[env:ftu]
build_flags =
    ${env.build_flags}
    -DFTU_DEBUG_SERIAL=0
    ; Refuse to build with the public development key.
    -DFTU_REQUIRE_KEY=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:ftu_bench]
build_flags =
    ${env.build_flags}
    -DFTU_DEBUG_SERIAL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
